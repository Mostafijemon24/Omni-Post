# /etc/nginx/sites-available/omnipost  →  ln -s to sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx
# TLS: sudo certbot --nginx -d post.avonixai.com
server {
    listen 80;
    server_name post.avonixai.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # AI generation can take a while
        proxy_read_timeout 130s;
    }
}
